<!-- ============== 反馈 ============== -->
<main class="feedback">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">反馈</span>
      <h2>向我们反馈</h2>
      <p>问题、报错或功能建议都可以填在这里。提交后会跳转到 GitHub Issues 并自动预填内容，登录 GitHub 后点击 <strong>Submit new issue</strong> 即创建。</p>
    </div>

    <form class="feedback-form" data-feedback-form novalidate>
      <div class="field">
        <label for="fb-type">类型</label>
        <select id="fb-type" name="type">
          <option value="问题报告 / Bug">问题报告 / Bug</option>
          <option value="功能建议">功能建议</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="field">
        <label for="fb-title">标题 <span class="req">*</span></label>
        <input id="fb-title" name="title" type="text" maxlength="120" placeholder="一句话概括你的问题或建议" required>
      </div>

      <div class="field">
        <label for="fb-desc">详细描述 <span class="req">*</span></label>
        <textarea id="fb-desc" name="desc" rows="6" maxlength="2000" placeholder="发生了什么？期望怎样？越具体越利于定位。" required></textarea>
      </div>

      <div class="field">
        <label for="fb-steps">复现步骤（选填）</label>
        <textarea id="fb-steps" name="steps" rows="3" maxlength="1000" placeholder="1. 打开… 2. 点击… 3. 出现…"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fb-contact">联系方式（选填）</label>
          <input id="fb-contact" name="contact" type="text" maxlength="80" placeholder="微信 / 邮箱，方便我们回复">
        </div>
        <div class="field">
          <label for="fb-ver">App 版本（选填）</label>
          <input id="fb-ver" name="version" type="text" maxlength="32" value="0.2.10" placeholder="如 0.2.10">
        </div>
      </div>

      <p class="fb-err" data-fb-err hidden></p>

      <div class="btn-row" style="justify-content: flex-start;">
        <button type="submit" class="btn btn-primary">提交到 GitHub Issues</button>
        <a class="btn btn-ghost" href="https://github.com/wuyi-levard/bean-roaster-site/issues" target="_blank" rel="noopener">直接去 Issues 页</a>
      </div>
      <p class="fb-hint">站点为纯静态页面、无后端，不会代替你自动发帖；最终需在 GitHub 侧登录并确认提交。反馈内容对仓库公开可见，请勿填写敏感信息。</p>
    </form>
  </div>
</main>
